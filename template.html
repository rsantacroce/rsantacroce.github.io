<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}}: Projects</title>
<meta name="description" content="{{TAGLINE}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbfaf7; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6a66;
    --border: #e6e3dc; --accent: #c2410c; --accent-soft: #fdeee4; --chip: #f2efe8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --surface: #1c1c1a; --text: #ecebe7; --muted: #9b9a95;
      --border: #2e2d2a; --accent: #f08a4b; --accent-soft: #33231a; --chip: #262523;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 Inter, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

  header { padding: 72px 0 40px; border-bottom: 1px solid var(--border); }
  .eyebrow { font: 500 13px/1 "JetBrains Mono", monospace; color: var(--accent); letter-spacing: .04em; text-transform: uppercase; }
  h1 { font-size: clamp(32px, 5vw, 48px); line-height: 1.1; letter-spacing: -.02em; margin: 14px 0 12px; font-weight: 600; }
  .tagline { font-size: 19px; color: var(--muted); margin: 0 0 28px; max-width: 680px; }
  .bio { max-width: 700px; }
  .bio p { margin: 0 0 14px; }
  .profile-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
  .profile-links a {
    text-decoration: none; font-size: 14px; padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface);
  }
  .profile-links a:hover { border-color: var(--accent); color: var(--accent); }

  .toolbar {
    position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: 12px 0;
  }
  .toolbar .wrap { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
  nav a { text-decoration: none; font-size: 14px; color: var(--muted); padding: 4px 10px; border-radius: 6px; }
  nav a:hover { color: var(--text); background: var(--chip); }
  input[type=search] {
    font: inherit; font-size: 14px; padding: 7px 12px; width: 220px; max-width: 100%;
    border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text);
  }
  input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  section { padding: 48px 0 8px; scroll-margin-top: 64px; }
  h2 { font-size: 22px; margin: 0 0 4px; font-weight: 600; letter-spacing: -.01em; }
  .count { font: 500 13px "JetBrains Mono", monospace; color: var(--muted); margin-left: 6px; }
  .intro { color: var(--muted); margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 8px;
    transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); transform: translateY(-1px); }
  .card h3 { margin: 0; font-size: 16px; font-weight: 600; }
  .card h3 a { text-decoration: none; }
  .card h3 a:hover { color: var(--accent); }
  .card p { margin: 0; font-size: 14.5px; color: var(--muted); flex: 1; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; }
  .meta span { font: 500 12px/1 "JetBrains Mono", monospace; padding: 5px 8px; border-radius: 6px; }
  .lang { background: var(--chip); color: var(--muted); }
  .private { background: var(--accent-soft); color: var(--accent); }
  .links { font: 12.5px "JetBrains Mono", monospace; color: var(--muted); overflow-wrap: anywhere; }
  .links a { text-decoration: none; }
  .links a:hover { color: var(--accent); text-decoration: underline; }
  .empty { display: none; color: var(--muted); padding: 40px 0; text-align: center; }

  footer { margin-top: 56px; padding: 28px 0 48px; border-top: 1px solid var(--border); color: var(--muted); font-size: 14px; }

  @media (max-width: 600px) {
    .wrap { padding: 0 16px; }
    header { padding-top: 48px; }
    .grid { grid-template-columns: 1fr; }
    input[type=search] { width: 100%; }
  }
</style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="eyebrow">Madrid · Programmer</div>
      <h1>{{NAME}}</h1>
      <p class="tagline">{{TAGLINE}}</p>
      <div class="bio">{{BIO}}</div>
      <div class="profile-links">{{LINKS}}</div>
    </div>
  </header>

  <div class="toolbar">
    <div class="wrap">
      <nav>{{NAV}}</nav>
      <input type="search" id="q" placeholder="Filter {{TOTAL}} projects…" aria-label="Filter projects">
    </div>
  </div>

  <main class="wrap">
{{SECTIONS}}
    <p class="empty" id="empty">No projects match that filter.</p>
  </main>

  <footer>
    <div class="wrap">Projects marked <strong>Private</strong> have closed source; where they have a public site, the name links to it.</div>
  </footer>

<script>
  const q = document.getElementById('q');
  const empty = document.getElementById('empty');
  q.addEventListener('input', () => {
    const term = q.value.trim().toLowerCase();
    let shown = 0;
    document.querySelectorAll('section').forEach(sec => {
      let n = 0;
      sec.querySelectorAll('.card').forEach(c => {
        const hit = !term || c.dataset.search.includes(term);
        c.hidden = !hit; if (hit) n++;
      });
      sec.hidden = n === 0; shown += n;
    });
    empty.style.display = shown ? 'none' : 'block';
  });
</script>
</body>
</html>
